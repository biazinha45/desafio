<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de Imagens</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #470909;
        }

        .carousel-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            height: 500px;
            overflow: hidden;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-buttons {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }

        .carousel-button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            font-size: 18px;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="carousel-container">
    <div class="carousel-slide active"><img src="image1.jpg" alt="Imagem 1"></div>
    <div class="carousel-slide"><img src="image2.jpg" alt="Imagem 2"></div>
    <div class="carousel-slide"><img src="image3.jpg" alt="Imagem 3"></div>
    <div class="carousel-buttons">
        <button class="carousel-button prev">◀</button>
        <button class="carousel-button next">▶</button>
    </div>
</div>

<script>
    const slides = document.querySelectorAll('.carousel-slide');
    const nextButton = document.querySelector('.carousel-button.next');
    const prevButton = document.querySelector('.carousel-button.prev');
    let currentIndex = 0;

    const updateSlides = () => {
        slides.forEach((slide, index) => {
            slide.classList.toggle('active', index === currentIndex);
        });
    };

    nextButton.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % slides.length;
        updateSlides();
    });

    prevButton.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        updateSlides();
    });

    // Muda automaticamente a cada 3 segundos
    setInterval(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        updateSlides();
    }, 3000);
</script>

</body>
</html>
